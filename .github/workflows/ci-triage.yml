name: CI triage

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  triage:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: yosrkharrat/CI-triage-agent@v1
        with:
          groq-api-key: ${{ secrets.GROQ_API_KEY }}
